<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Reproduzindo Músicas </title>
        <link rel="stylesheet" href="./index.css">
    </head>
    <body>
        <div class="janela">
            <!-- Área fixa do botão de abrir músicas -->
            <div class="janela-botao">
                <div class="faixa">
                    <label for="arquivo"> Abrir músicas </label>
                    <input type="file" id="arquivo" multiple accept="audio/mpeg, audio/wav">
                </div>
            </div>

            <!-- Área onde a lista de músicas será exibida (separada do botão) -->
            <div class="janela-faixas">
            </div>

            <div class="janela-reprodutor">
                <audio controls></audio>
            </div>
        </div>

        <script>
            const audio = document.querySelector("audio")
            const entrada = document.querySelector("input")
            const faixas = document.querySelector("div.janela-faixas")
            const arquivos = new Array()

            function Apresentar() {
                // Limpa apenas a lista de músicas, preservando o botão que está em outro container
                faixas.innerHTML = ""
                
                arquivos.forEach(function(arquivo, indice) {
                    const musica = document.createElement("div")
                    musica.setAttribute("class", "faixa")
                    musica.setAttribute("onclick", `Tocar(${ indice })`)
                    musica.textContent = arquivo.nome
                    faixas.appendChild(musica)
                })
            }

            function Tocar(indice) {
                audio.setAttribute("src", arquivos[indice].endereco)
                audio.play()
            }

            entrada.addEventListener("change", function() {
                for ( const dado of entrada.files ) {
                    const nome = dado.name
                    const endereco = URL.createObjectURL(dado)
                    arquivos.push({ nome, endereco })
                }
                Apresentar()
                
                // Reseta o input para permitir selecionar os mesmos arquivos novamente se quiser
                entrada.value = ""
            })
        </script>
    </body>
</html>
